[project]
name = "smart-alarm-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pymongo>=4.13",
  "pydantic-settings>=2.4",
  "fsrs>=6.0",
  "apscheduler>=3.10,<4",
  "icalendar>=6",
  "recurring-ical-events>=3",
  "httpx>=0.27",
  "anthropic>=0.40",
  "fish-audio-sdk>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
