<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f0e3">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Wake-Up</title>
<style>
:root{
  --paper:#f6f0e3;--card:#fbf7ee;--ink:#1d1a16;--mute:#746a5a;--rule:#d9cdb6;
  --oxblood:#6b1d2a;--brass:#8a6b2c;--ok:#2a5436;--warn:#8a5a12;
  --press:#efe5cf;
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
@media(pointer:fine){html{overscroll-behavior:none}}
html,body{margin:0;background:#e9e1cf;color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  touch-action:manipulation}
#app{max-width:460px;min-height:100svh;margin:0 auto;background:var(--paper)}
@media(min-width:520px){#app{margin:24px auto;min-height:840px;border:1px solid var(--rule);box-shadow:0 18px 50px rgba(60,40,10,.12)}}

/* one focus treatment for everything that takes focus */
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:4px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 2px;min-height:52px}
.bar button{min-height:44px;display:inline-flex;align-items:center;gap:6px;
  background:none;border:0;color:var(--oxblood);font:inherit;font-size:17px;padding:6px 8px;cursor:pointer}
.bar button:hover{color:var(--ink)}
.bar button:active{opacity:.6}
.bar .state{color:var(--mute);font-size:15px;font-style:italic}
.wrap{padding:0 22px calc(32px + env(safe-area-inset-bottom))}

h1{font-size:34px;font-weight:600;letter-spacing:.2px;margin:4px 0 2px;text-wrap:balance}
h2{font-size:17px;font-weight:600;font-style:italic;color:var(--ink);margin:30px 0 8px;
  padding-bottom:6px;border-bottom:1px solid var(--rule)}
h3{font-size:23px;margin:26px 0 6px;font-weight:600;text-wrap:balance}
.sub{color:var(--mute);font-style:italic;font-size:16px;margin:0 0 14px;line-height:1.45}

.list{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.row{display:block;width:100%;min-height:52px;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--rule);padding:13px 16px;font:inherit;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#f7efdd}
.row:active{background:var(--press)}
.row .t{font-weight:600;font-size:18px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row .t span{min-width:0;overflow-wrap:break-word}
.row .t small{flex:none;font-weight:400;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.row .p{color:var(--mute);font-size:15px;margin-top:3px;line-height:1.4;overflow-wrap:break-word}
.static{cursor:default}
.static:hover,.static:active{background:none}

.lock{width:13px;height:13px;vertical-align:-1px;margin-left:6px;fill:none;stroke:var(--brass);stroke-width:1.8}
.note p{font-size:18px;line-height:1.62;margin:0 0 14px;max-width:64ch}
.kind{font-size:15px;color:var(--mute);font-style:italic;margin:0 0 10px}
.rule{height:1px;background:var(--rule);margin:24px 0;border:0}

.cta{display:block;width:100%;min-height:48px;margin-top:14px;padding:13px 16px;
  border:1px solid var(--oxblood);background:var(--oxblood);color:#f8f3e6;border-radius:10px;
  font:inherit;font-size:17px;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.cta:hover{background:#56141f}
.cta:active{background:#43101a}
.cta.ghost{background:none;color:var(--oxblood)}
.cta.ghost:hover{background:#f1e4df}
.cta.ghost:active{background:#e9d8d2}
.cta[disabled]{opacity:.45;cursor:default;background:var(--oxblood)}
.cta[aria-busy=true]{cursor:progress}

.prog{height:3px;background:var(--rule);margin:12px 0 0}
.prog i{display:block;height:100%;width:0;background:var(--brass)}
@media(prefers-reduced-motion:no-preference){.prog i{transition:width .3s linear}}

.q{font-size:21px;line-height:1.4;margin:10px 0 16px;text-wrap:pretty}
.opt{display:block;width:100%;min-height:48px;text-align:left;padding:13px 16px;margin:0 0 10px;
  background:var(--card);border:1px solid var(--rule);border-radius:10px;font:inherit;font-size:17px;
  color:inherit;cursor:pointer}
.opt:hover{border-color:var(--brass)}
.opt:active{background:var(--press)}
.opt[aria-pressed=true]{border-color:var(--oxblood);border-width:2px;background:#f3e6e2;font-weight:600}

.tl{margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.tl li:last-child{border-bottom:0}
.tl .tm{color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
.tl .ti{font-size:18px;font-weight:600;overflow-wrap:break-word}
.tl .no{font-size:15px;color:var(--mute);font-style:italic;margin-top:2px}
.tl .hold .ti{color:var(--brass)}
.tl .clash .ti{color:var(--oxblood)}

.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:13px 16px;border-bottom:1px solid var(--rule)}
.chk:last-child{border-bottom:0}
.chk .c{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--brass);margin-top:4px}
.chk.done .c{background:var(--ok);border-color:var(--ok)}
.chk.done .tx{color:var(--mute);text-decoration:line-through}
.chk .src{font-size:14px;color:var(--mute);font-style:italic;margin-top:2px}

.badge{display:inline-block;font-size:13px;border:1px solid var(--oxblood);color:var(--oxblood);
  padding:1px 8px;border-radius:20px;margin-left:8px;vertical-align:2px;font-style:italic}
.big{font-size:54px;text-align:center;margin:30px 0 4px;font-weight:600;color:var(--oxblood);
  font-variant-numeric:tabular-nums}
.center{text-align:center}
.empty{padding:20px 16px;color:var(--mute);font-style:italic;font-size:16px;text-align:center}

/* ---- forms ---- */
.field{padding:14px 16px;border-bottom:1px solid var(--rule)}
.field:last-child{border-bottom:0}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:6px}
.field .hint{font-size:14px;color:var(--mute);font-style:italic;margin-top:7px;line-height:1.4}
.field input{width:100%;min-height:44px;font:inherit;font-size:17px;color:var(--ink);
  background:#fffdf7;border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.field input::placeholder{color:#a79a85}
.field input:focus{border-color:var(--brass)}
.inrow{display:flex;gap:8px;align-items:stretch}
.inrow input{flex:1;min-width:0}
.inrow button{flex:none;min-width:72px;min-height:44px;font:inherit;font-size:16px;
  background:none;border:1px solid var(--rule);border-radius:8px;color:var(--oxblood);cursor:pointer}
.inrow button:hover{border-color:var(--brass)}
.inrow button[aria-pressed=true]{background:var(--press)}
.err{color:var(--oxblood);font-size:16px;line-height:1.45;margin:10px 0 0}
.pair{display:flex;gap:10px}
.jot{position:fixed;right:calc(14px + env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;
  min-height:48px;padding:12px 20px;border-radius:26px;border:1px solid var(--oxblood);
  background:var(--oxblood);color:#f8f3e6;font:inherit;font-size:17px;cursor:pointer;
  box-shadow:0 6px 18px rgba(60,40,10,.22)}
.jot:hover{background:#56141f}
.jot:active{background:#43101a}
@media(min-width:520px){.jot{position:absolute}}
.ta{width:100%;min-height:120px;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);
  background:#fffdf7;border:1px solid var(--rule);border-radius:10px;padding:12px;resize:vertical}
.ta:focus{border-color:var(--brass)}
.entry{padding:12px 16px;border-bottom:1px solid var(--rule);font-size:17px;line-height:1.45}
.entry:last-child{border-bottom:0}
.entry .tm{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;margin-bottom:2px}
.pair .cta{flex:1;min-width:0;font-size:16px}

.checks{margin:16px 0 0;padding:0;list-style:none;background:var(--card);
  border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--rule);font-size:16px;line-height:1.4}
.checks li:last-child{border-bottom:0}
.checks .m{font-weight:700;line-height:1.3}
.checks .ok .m{color:var(--ok)}
.checks .warn .m{color:var(--warn)}
.checks .bad .m{color:var(--oxblood)}
.checks .d{color:var(--mute);font-size:14px;font-style:italic;margin-top:2px}
</style></head><body><div id="app"></div>
<script>
const DATA=/*DATA*/null;
const $=s=>document.querySelector(s);
const MOCK=JSON.parse(JSON.stringify(DATA));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let live=false,liveErr='',result=null,checks=[],busy='';
let view='home',unlocked=false,readDone=false,qi=0,answers=[],tries=0,sel=null,timer=null;

const CFG=()=>{try{return JSON.parse(localStorage.getItem('wk')||'{}')}catch(e){return{}}};
let draft=null;
/* The address can arrive three ways: already saved, baked into the build, or in the page's
   own #s= fragment, which is never sent to any server and keeps it off a public page. */
function hashUrl(){try{const m=/[#&]s=([^&]+)/.exec(location.hash||'');return m?decodeURIComponent(m[1]):''}catch(e){return ''}}
const getDraft=()=>{if(!draft){const c=CFG();draft={url:c.url||hashUrl()||(DATA.preset&&DATA.preset.url)||'',token:c.token||'',show:false}}return draft};

/* A server address typed on a phone arrives without a scheme and often with a trailing slash.
   Anything but a local address gets https, so a typed hostname is never sent in the clear. */
const LOCAL=/^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$|\.(local|test)(:\d+)?$/i;
function normalizeUrl(raw){
  let u=String(raw||'').trim().replace(/\s/g,'');
  if(!u)return '';
  if(!/^https?:\/\//i.test(u)){
    u=u.replace(/^\/+/,'');
    u=(LOCAL.test(u.split('/')[0])?'http://':'https://')+u;
  }
  return u.replace(/\/+$/,'');
}
function host(u){try{return new URL(u).host}catch(e){return u}}

async function api(path,opt,ms){
  const c=CFG();
  if(!c.url)throw new Error('No server address saved yet.');
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms||12000);
  try{
    const r=await fetch(c.url+path,Object.assign({},opt,{signal:ac.signal,
      headers:{Authorization:'Bearer '+(c.token||''),'Content-Type':'application/json'}}));
    if(!r.ok){const e=new Error(path+' returned '+r.status);e.status=r.status;throw e}
    return r;
  }catch(e){
    if(e.name==='AbortError'){const x=new Error('timed out after '+Math.round((ms||12000)/1000)+' seconds');x.timeout=true;throw x}
    throw e;
  }finally{clearTimeout(t)}
}

const KIND={missed_news:'Missed news',research:'Research in today’s field',wildcard:'Wildcard'};
const fmtDate=iso=>{try{return new Intl.DateTimeFormat(undefined,{weekday:'long',day:'numeric',month:'long'}).format(new Date(iso+'T12:00:00'))}catch(e){return iso}};

/* Each endpoint is checked on its own, so one gap never hides the rest. */
async function loadLive(){
  const c=CFG();checks=[];
  if(!c.url||!c.token){live=false;liveErr='';Object.assign(DATA,MOCK);return}
  let reachable=false;
  try{
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),8000);
    const r=await fetch(c.url+'/health',{signal:ac.signal});clearTimeout(t);
    reachable=r.ok;
    checks.push(r.ok?{k:'ok',n:'Server answers',d:host(c.url)}
      :{k:'bad',n:'Server answered '+r.status,d:'Check the address in Railway, then save again.'});
  }catch(e){
    checks.push({k:'bad',n:'Cannot reach the server',
      d:e.name==='AbortError'?'No answer within 8 seconds. Check the address.'
        :'Nothing left this browser. Open the address in a tab: if it answers, this page is '
         +'blocking outside requests, so open the GitHub Pages copy of the app instead.'});
  }
  const got=await Promise.allSettled([api('/issue/today'),api('/quiz/today'),api('/day'),api('/tasks/today')]);
  const [iss,quiz,day,tasks]=got;
  const name=['Today’s issue','Recall questions','Day plan','Tasks'];
  const unauthorized=got.some(g=>g.status==='rejected'&&g.reason&&g.reason.status===401);
  if(reachable)checks.push(unauthorized
    ?{k:'bad',n:'Token refused',d:'Copy API_TOKEN from your Railway variables exactly, with no spaces.'}
    :{k:'ok',n:'Token accepted',d:''});
  got.forEach((g,i)=>{
    if(g.status==='fulfilled'){checks.push({k:'ok',n:name[i],d:''});return}
    const s=g.reason&&g.reason.status;
    if(s===404)checks.push({k:'warn',n:name[i]+' not written yet',
      d:'The 5:37 am task writes it. Nothing is wrong with the server.'});
    else if(s===401)checks.push({k:'bad',n:name[i],d:'Token refused.'});
    else checks.push({k:'bad',n:name[i],d:String(g.reason&&g.reason.message||g.reason)});
  });

  const d={};let any=false,miss=[];
  if(iss.status==='fulfilled'&&quiz.status==='fulfilled'){
    const I=await iss.value.json(),Q=await quiz.value.json();
    Object.assign(d,{
      date:fmtDate(I.date),
      readings:{cite:I.readings.map(r=>r.reference).join(' and '),
                gist:I.reflection||I.readings.map(r=>r.text).join(' ')},
      flag:I.critical&&I.critical.length?I.critical.join(' '):null,
      articles:I.articles.map(a=>({tag:KIND[a.kind]||a.kind,title:a.title,body:a.body.split(/\n\s*\n/)})),
      quiz:Q.map(q=>({id:q.id,q:q.prompt,o:q.choices}))});
    any=true;
  }else miss.push('the issue and recall questions');
  if(day.status==='fulfilled'){
    const D=await day.value.json();
    Object.assign(d,{events:(D.events||[]).filter(e=>!e.all_day).map(e=>({start:e.start,end:e.end,title:e.title,note:e.location||''})),
      mail:(D.mail||[]).map(m=>({from:m.sender,subject:m.subject,why:''})),
      notes:D.notes||'',errors:D.errors||[]});
    any=true;
  }else miss.push('the day plan');
  try{
    const N=await api('/notes/today').then(r=>r.json());
    d.notes=N.map(x=>({when:localTime(x.at),text:x.text}));
  }catch(e){d.notes=[]}
  if(tasks.status==='fulfilled'){
    const T=await tasks.value.json();
    d.evening=T.map(t=>({t:t.title,done:t.status==='done',
      src:t.status==='done'?('Detected: '+(t.source||'marked done')):(t.note||'Not detected yet')}));
    any=true;
  }else miss.push('tasks');

  live=any;
  liveErr=any?(miss.length?'Sample content is standing in for '+miss.join(', ')+'.':''):'Nothing could be loaded from the server.';
  Object.assign(DATA,MOCK,d,{mode:any?(miss.length?'Partly live':'Live'):'Sample',files:d.files||[]});
}

const LOCK='<svg class="lock" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>';
function go(v){view=v;sel=null;render();window.scrollTo(0,0)}
function bar(back,trailing){
  const b=back===null?'<span></span>'
    :`<button type="button" onclick="go('${back||'home'}')">‹ ${back&&back!=='home'?'Back':'Notes'}</button>`;
  return `<div class="bar">${b}${trailing||'<span></span>'}</div>`;
}
function fmt(t){const[h,m]=String(t).split(':').map(Number);const ap=h>=12?'pm':'am';return(h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+' '+ap}
function dayItems(){
  const items=[{s:'07:00',e:'07:15',t:'Wake-up issue',n:'Readings, three articles, recall',k:''},
  {s:'07:35',e:'08:00',t:'Breakfast, coffee, walk',n:'Protected',k:'hold'}];
  (DATA.events||[]).forEach(e=>items.push({s:e.start,e:e.end,t:e.title,n:e.note||'',k:''}));
  items.sort((a,b)=>a.s.localeCompare(b.s));
  items.forEach((a,i)=>{items.forEach((b,j)=>{if(i!==j&&a.k!=='hold'&&b.k!=='hold'&&a.s<b.e&&b.s<a.e&&a.t!=='Wake-up issue'&&b.t!=='Wake-up issue')a.k='clash'})});
  return items}
function rundown(){
  const ev=DATA.events||[],c=dayItems().filter(x=>x.k==='clash');
  let s=`Good morning ${DATA.name}. It is ${DATA.date}. `;
  s+=ev.length?`You have ${ev.length} ${ev.length===1?'thing':'things'} on the calendar, starting with ${ev[0].title} at ${fmt(ev[0].start)}. `:'Your calendar is clear. ';
  if(c.length)s+=`Heads up, ${c[0].title} overlaps with another event. `;
  s+=(DATA.mail&&DATA.mail[0])?`Top of your inbox: ${DATA.mail[0].subject}. `:'';
  s+='Your breakfast block is protected from seven thirty five. That is everything.';return s}
let aud=null,voiceState='',voiceUrl='',skipping=false,submitting=false,connecting=false;
/* One tap starts it, a second stops it. The guard is set before the first await, or two
   quick taps both get past it and you hear the rundown twice, over itself. */
function paintVoice(){
  document.querySelectorAll('[data-voice]').forEach(b=>{
    b.textContent = voiceState==='loading' ? 'Preparing the voice\u2026'
                  : voiceState==='playing' ? 'Stop'
                  : b.dataset.voice;
    b.setAttribute('aria-busy', voiceState==='loading');
  });
}
function stopSpeech(){
  try{if(aud){aud.pause();aud=null}}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  voiceState='';paintVoice();
}
function deviceVoice(){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(rundown());u.rate=.98;
    u.onend=()=>{voiceState='';paintVoice()};
    speechSynthesis.speak(u);voiceState='playing';
  }catch(e){voiceState=''}
  paintVoice();
}
async function speak(){
  if(voiceState){stopSpeech();return}
  voiceState='loading';paintVoice();
  const play=async(src)=>{
    const a=new Audio(src);
    a.onended=()=>{voiceState='';paintVoice()};
    await a.play();
    if(voiceState!=='loading'){a.pause();return}   // stopped while it loaded
    aud=a;voiceState='playing';paintVoice();
  };
  try{
    if(voiceUrl){await play(voiceUrl);return}      // already fetched once this session
    if(live){
      const b=await api('/jarvis/speak',null,30000).then(r=>r.blob());
      if(voiceState!=='loading')return;
      voiceUrl=URL.createObjectURL(b);
      await play(voiceUrl);return;
    }
    if(DATA.audio){await play(DATA.audio);return}
  }catch(e){}
  deviceVoice();
}
function home(){
  const ev=DATA.events||[],mail=DATA.mail||[],files=DATA.files||[],evening=DATA.evening||[];
  const left=evening.filter(x=>!x.done).length;
  const trailing=`<button type="button" onclick="go('settings')" aria-label="Settings. Content is ${esc(DATA.mode||'Sample')}."><span class="state">${esc(DATA.mode||'Sample')}</span>&nbsp;Settings</button>`;
  return `<div class="bar"><span style="padding-left:8px">Folders</span>${trailing}</div><div class="wrap">
  <h1>Wake-Up</h1><p class="sub">${esc(DATA.date)}</p>
  ${liveErr?`<p class="sub" style="color:var(--warn)">${esc(liveErr)}</p>`:''}
  <h2>Pinned</h2><div class="list">
  <button type="button" class="row" onclick="go('issue')"><div class="t"><span>Morning Issue</span><small>7:00 am</small></div><div class="p">${esc(DATA.readings.cite)}, three articles, fifteen minutes</div></button>
  <button type="button" class="row" onclick="go('recall')"><div class="t"><span>Recall</span><small>${readDone?'ready':'after reading'}</small></div><div class="p">${DATA.quiz.length} questions, two tries, 70% opens the day</div></button>
  <button type="button" class="row" onclick="go('today')"><div class="t"><span>Today${unlocked?'':LOCK}</span><small>8:00 am</small></div><div class="p">${unlocked?(ev.length?ev.length+' events, breakfast block protected':'Calendar clear, breakfast block protected'):'Locked until recall is passed'}</div></button>
  <button type="button" class="row" onclick="go('evening')"><div class="t"><span>Evening Check</span><small>10:30 pm</small></div><div class="p">${left} left over, done detected from your sources</div></button>
  <button type="button" class="row" onclick="go('jarvis')"><div class="t"><span>Jarvis</span><small>on request</small></div><div class="p">Voice rundown. Silent until you tap it.</div></button></div>
  <h2>Sources</h2><div class="list">
  <button type="button" class="row" onclick="go('mail')"><div class="t"><span>Mail</span><small>${mail.length}</small></div><div class="p">${esc(mail[0]?mail[0].subject:'Nothing new')}</div></button>
  <button type="button" class="row" onclick="go('log')"><div class="t"><span>Day log</span><small>${(DATA.notes||[]).length}</small></div><div class="p">${esc((DATA.notes||[])[0]?(DATA.notes||[]).slice(-1)[0].text:'Anything you want tonight to act on')}</div></button>
  <button type="button" class="row" onclick="go('files')"><div class="t"><span>Files</span><small>${files.length}</small></div><div class="p">${esc(files[0]?files[0].title:'Nothing recent')}</div></button></div>
  </div>`}
function issue(){
  const a=DATA.articles.map(x=>`<h3>${esc(x.title)}</h3><p class="kind">${esc(x.tag)}</p>${x.body.map(p=>`<p>${esc(p)}</p>`).join('')}`).join('<hr class="rule">');
  return bar()+`<div class="wrap note"><p class="kind">Morning issue</p><h1 style="font-size:30px">${esc(DATA.date)}</h1>
  <div class="prog"><i id="pg"></i></div><p class="kind" style="margin-top:7px">Reading time runs at 60&times; in this preview</p>
  <h3>${esc(DATA.readings.cite)}</h3><p>${esc(DATA.readings.gist)}</p>
  <p class="kind">${esc(DATA.flag||'No critical issues today.')}</p><hr class="rule">${a}
  <button type="button" class="cta" id="rd" onclick="startRead()">Begin reading</button></div>`}
function startRead(){
  const b=$('#rd');b.disabled=true;let t=0;const total=15*60;
  clearInterval(timer);timer=setInterval(()=>{t+=60;$('#pg').style.width=Math.min(100,t/total*100)+'%';
  b.textContent='Reading, '+Math.max(0,15-Math.round(t/60))+' min left';
  if(t>=total){clearInterval(timer);readDone=true;b.disabled=false;b.textContent='Continue to recall';b.onclick=()=>go('recall')}},1000)}
async function submitLive(){
  if(submitting)return;submitting=true;          // a second render must not spend a second attempt
  const body={answers:Object.fromEntries(DATA.quiz.map((q,i)=>[q.id,answers[i]]))};
  try{result=await api('/quiz/submit',{method:'POST',body:JSON.stringify(body)}).then(r=>r.json())}
  catch(e){result={result:'retry',score:0,error:String(e.message||e)}}
  finally{submitting=false}
  render()}
function recall(){
  if(!readDone)return bar()+`<div class="wrap note"><h1>Recall</h1><p class="sub">Opens after the morning reading.</p><button type="button" class="cta" onclick="readDone=true;go('recall')">Skip ahead (preview only)</button></div>`;
  const liveQuiz=live&&DATA.quiz.length&&DATA.quiz[0].id;
  if(liveQuiz&&qi>=DATA.quiz.length){
    if(!result){submitLive();return bar(null)+`<div class="wrap center"><p class="sub" aria-live="polite">Checking…</p></div>`}
    const r=result,pct=Math.round(r.score*100);
    if(r.result==='unlocked'){unlocked=true;return bar(null)+`<div class="wrap center"><div class="big">${pct}%</div><p class="sub">The day is open.</p><button type="button" class="cta" onclick="go('today')">Open Today</button></div>`}
    return bar(null)+`<div class="wrap center"><div class="big" style="color:var(--mute)">${pct}%</div><p class="sub">Seventy percent opens the day.</p>
    ${r.error?`<p class="err">${esc(r.error)}</p>`:''}
    ${r.result==='retry'?`<button type="button" class="cta" onclick="result=null;qi=0;answers=[];go('recall')">Second attempt</button>`:`<p class="sub">Two attempts used.</p><button type="button" class="cta ghost" onclick="emergencySkip()">Emergency skip, which is recorded</button>`}</div>`}
  if(qi>=DATA.quiz.length){
    const n=answers.filter((a,i)=>a===DATA.quiz[i].a).length,pct=Math.round(n/DATA.quiz.length*100),pass=pct>=70;
    if(pass){unlocked=true;return bar(null)+`<div class="wrap center"><div class="big">${pct}%</div><p class="sub">${n} of ${DATA.quiz.length} correct. The day is open.</p><button type="button" class="cta" onclick="go('today')">Open Today</button></div>`}
    return bar(null)+`<div class="wrap center"><div class="big" style="color:var(--mute)">${pct}%</div><p class="sub">${n} of ${DATA.quiz.length}. Seventy percent opens the day.</p>
    ${tries<1?`<button type="button" class="cta" onclick="tries++;qi=0;answers=[];go('recall')">Second attempt</button>`:`<p class="sub">Two attempts used.</p><button type="button" class="cta ghost" onclick="emergencySkip()">Emergency skip, which is recorded</button>`}</div>`}
  const q=DATA.quiz[qi];
  return bar(null)+`<div class="wrap"><p class="kind">Question ${qi+1} of ${DATA.quiz.length}, attempt ${tries+1} of 2</p><p class="q">${esc(q.q)}</p>
  ${q.o.map((o,i)=>`<button type="button" class="opt" aria-pressed="${sel===i}" onclick="sel=${i};render()">${esc(o)}</button>`).join('')}
  <button type="button" class="cta" ${sel===null?'disabled':''} onclick="answers[qi]=sel;qi++;sel=null;render()">${qi===DATA.quiz.length-1?'Finish':'Next question'}</button></div>`}
function today(){
  if(!unlocked)return bar()+`<div class="wrap note"><h1>Today${LOCK}</h1><p class="sub">Locked until recall is passed.</p><button type="button" class="cta" onclick="go('recall')">Go to recall</button></div>`;
  const it=dayItems();
  return bar()+`<div class="wrap note"><h1>Today</h1><p class="sub">${esc(DATA.date)}${DATA.notes?' — '+esc(DATA.notes):''}</p><div class="list" style="padding:2px 16px"><ul class="tl">
  ${it.map(x=>`<li class="${x.k}"><div class="tm">${fmt(x.s)}</div><div><div class="ti">${esc(x.t)}${x.k==='clash'?'<span class="badge">overlap</span>':''}</div>${x.n?`<div class="no">${esc(x.n)}</div>`:''}</div></li>`).join('')}</ul></div>
  <button type="button" class="cta ghost" data-voice="Play my rundown" onclick="speak()">Play my rundown</button></div>`}
function evening(){
  const e=DATA.evening||[];
  return bar()+`<div class="wrap note"><h1>Evening Check</h1><p class="sub">At 10:30 pm, done is detected rather than asked.</p><div class="list">
  ${e.length?e.map(x=>`<div class="chk ${x.done?'done':''}"><div class="c"></div><div><div class="tx">${esc(x.t)}</div><div class="src">${esc(x.src)}</div></div></div>`).join(''):'<p class="empty">Nothing on today’s list.</p>'}</div>
  <p class="sub" style="margin-top:14px">Leftovers roll into tomorrow’s list.</p></div>`}
function mail(){
  const m=DATA.mail||[];
  return bar()+`<div class="wrap note"><h1>Mail</h1><p class="sub">Since yesterday</p><div class="list">${m.length?m.map(x=>`<div class="row static"><div class="t"><span>${esc(x.subject)}</span></div><div class="p">${esc(x.from)}${x.why?', '+esc(x.why):''}</div></div>`).join(''):'<p class="empty">Nothing new in the inbox.</p>'}</div></div>`}
function files(){
  const f=DATA.files||[];
  return bar()+`<div class="wrap note"><h1>Files</h1><p class="sub">Recently touched</p><div class="list">${f.length?f.map(x=>`<div class="row static"><div class="t"><span>${esc(x.title)}</span><small>${esc(x.when||'')}</small></div><div class="p">${esc(x.kind||'')}</div></div>`).join(''):'<p class="empty">Nothing recent. The evening check reads Drive and GitHub directly.</p>'}</div></div>`}
function jarvis(){return bar()+`<div class="wrap note"><h1>Jarvis</h1><p class="sub">Never speaks on its own.</p><p>${esc(rundown())}</p>
  <button type="button" class="cta" data-voice="Play rundown" onclick="speak()">Play rundown</button></div>`}
/* The gate is meant to be skippable. It is also meant to cost something to look back on,
   so every skip is written to the server before the day opens. */
async function emergencySkip(){
  if(skipping)return;skipping=true;
  if(live){try{await api('/quiz/skip',{method:'POST',body:JSON.stringify({reason:'skipped from the app'})})}catch(e){}}
  skipping=false;unlocked=true;go('today');
}

/* ---- the day log ---- */
let logDraft='',logBusy='',logMsg='';
function logView(){
  const n=DATA.notes||[];
  return bar('home')+`<div class="wrap note">
  <h1>Day log</h1>
  <p class="sub">Anything you want tonight\u2019s run to act on. It reads this at 10:30.</p>
  <label for="jt" style="display:block;font-size:15px;font-weight:600;margin-bottom:6px">What\u2019s on your mind</label>
  <textarea id="jt" class="ta" placeholder="Move the gym to 6. Draft a reply to Alyssa saying yes. Remind me to book the flight\u2026"
    oninput="logDraft=this.value" enterkeyhint="done">${esc(logDraft)}</textarea>
  <button type="button" class="cta" id="jsave" onclick="saveNote()" ${logBusy?'aria-busy="true" disabled':''}>${logBusy||'Add to today'}</button>
  <div aria-live="polite">${logMsg?`<p class="sub" style="margin-top:12px">${esc(logMsg)}</p>`:''}</div>
  <h2>Today, ${n.length} ${n.length===1?'entry':'entries'}</h2>
  <div class="list">${n.length?n.map(x=>`<div class="entry"><div class="tm">${esc(x.when)}</div>${esc(x.text)}</div>`).join(''):'<p class="empty">Nothing yet today.</p>'}</div>
  <button type="button" class="cta ghost" onclick="processNow()">Send it to Claude now</button>
  <p class="sub">Otherwise it goes at 10:30 with everything else.</p>
  </div>`}
async function saveNote(){
  const t=(($('#jt')&&$('#jt').value)||logDraft).trim();
  if(!t){logMsg='Nothing to add yet.';render();return}
  if(logBusy)return;
  logBusy='Saving\u2026';render();
  if(live){
    try{
      const n=await api('/notes',{method:'POST',body:JSON.stringify({text:t})}).then(r=>r.json());
      (DATA.notes=DATA.notes||[]).push({when:localTime(n.at),text:n.text});
      logDraft='';logMsg='Added.';
    }catch(e){logMsg='Could not save it to the server: '+String(e.message||e)+' It is still in the box.';}
  }else{
    (DATA.notes=DATA.notes||[]).push({when:localTime(new Date().toISOString()),text:t});
    logDraft='';logMsg='Added to the sample log. Connect a server to keep it.';
  }
  logBusy='';render();
}
async function processNow(){
  if(!live){logMsg='Connect a server first, then this hands the day over.';render();return}
  try{await api('/notes/process-now',{method:'POST',body:'{}'});logMsg='Handed over. The next run picks it up.';}
  catch(e){logMsg='Could not ask for it: '+String(e.message||e)}
  render();
}
const localTime=iso=>{try{return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(iso))}catch(e){return iso}};

/* ---- settings ---- */
function settings(){
  const d=getDraft(),c=CFG(),saved=!!c.url;
  const marks={ok:'✓',warn:'!',bad:'✕'};
  return bar('home')+`<div class="wrap note">
  <h1>Settings</h1>
  <p class="sub">${live?'Connected to '+esc(host(c.url))+'.':saved?'Saved, but not loading. The checks below say why.':'Not connected. Showing sample content.'}</p>

  <h2>Your server</h2>
  <div class="list">
    <div class="field">
      <label for="su">Server address</label>
      <input id="su" name="server-url" type="url" inputmode="url" enterkeyhint="go"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="backend-production-xxxx.up.railway.app…"
        value="${esc(d.url)}" oninput="draft.url=this.value" onkeydown="if(event.key==='Enter')saveCfg()">
      <p class="hint">From Railway, under your service, Settings, Networking. The https is added for you.</p>
    </div>
    <div class="field">
      <label for="st">API token</label>
      <div class="inrow">
        <input id="st" name="api-token" type="${d.show?'text':'password'}" enterkeyhint="go"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" translate="no"
          placeholder="Paste API_TOKEN…"
          value="${esc(d.token)}" oninput="draft.token=this.value" onkeydown="if(event.key==='Enter')saveCfg()">
        <button type="button" aria-pressed="${d.show}" onclick="draft.token=$('#st').value;draft.show=!draft.show;render()">${d.show?'Hide':'Show'}</button>
      </div>
      <p class="hint">The same API_TOKEN you set in Railway. It stays in this browser and is never sent anywhere else.</p>
    </div>
  </div>

  <button type="button" class="cta" id="sv" onclick="saveCfg()" ${busy?'aria-busy="true" disabled':''}>${busy||'Save and connect'}</button>
  ${saved?`<div class="pair">
    <button type="button" class="cta ghost" onclick="saveCfg()">Check again</button>
    <button type="button" class="cta ghost" onclick="forgetServer()">Forget this server</button>
  </div>`:''}

  <div aria-live="polite">
  ${checks.length?`<h2>Checks</h2><ul class="checks">${checks.map(x=>`<li class="${x.k}"><span class="m" aria-hidden="true">${marks[x.k]}</span><div><div>${esc(x.n)}</div>${x.d?`<div class="d">${esc(x.d)}</div>`:''}</div></li>`).join('')}</ul>`:''}
  </div>
  </div>`}
async function saveCfg(){
  if(connecting)return;connecting=true;
  try{await doSave()}finally{connecting=false}
}
async function doSave(){
  const u=normalizeUrl($('#su')?$('#su').value:draft.url),t=($('#st')?$('#st').value:draft.token).trim();
  draft.url=u;draft.token=t;
  if(!u){checks=[{k:'bad',n:'Enter the server address first',d:'The Railway domain for your backend service.'}];render();return}
  if(!t){checks=[{k:'bad',n:'Enter the API token first',d:'Copy API_TOKEN from your Railway variables.'}];render();return}
  try{localStorage.setItem('wk',JSON.stringify({url:u,token:t}))}catch(e){
    checks=[{k:'bad',n:'This browser refused to save the settings',d:'Private browsing blocks storage. Try a normal window.'}];render();return}
  busy='Connecting…';render();
  readDone=false;unlocked=false;qi=0;answers=[];tries=0;result=null;
  await loadLive();
  busy='';render();
}
function forgetServer(){
  try{localStorage.removeItem('wk')}catch(e){}
  draft={url:'',token:'',show:false};checks=[];live=false;liveErr='';
  boot();
}
function render(){
  const v={home,issue,recall,today,evening,mail,files,jarvis,settings,log:logView}[view];
  const jot=view==='log'?'':'<button type="button" class="jot" onclick="go(\'log\')">Note</button>';
  $('#app').innerHTML=v()+jot;
  paintVoice();
}
async function boot(){readDone=false;unlocked=false;qi=0;answers=[];tries=0;result=null;await loadLive();render()}
boot();
</script></body></html>
